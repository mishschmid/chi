# Production deployment for Chi on Dokploy
#
# Assumptions:
# - Dokploy manages Traefik, domains, and Let's Encrypt SSL.
# - Postgres database runs with pgvector extension.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chi:latest
    restart: unless-stopped
    environment:
      NITRO_PORT: 3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      DATABASE_URL: postgresql://chi:${POSTGRES_PASSWORD}@postgres:5432/chi
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-4o}
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-gpt-4o-mini}
      OPENAI_VOICE: ${OPENAI_VOICE:-nova}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-tts-1}
      SANSA_API_URL: ${SANSA_API_URL:-https://sansa.you}
      SANSA_SERVICE_SECRET: ${SANSA_SERVICE_SECRET:-}
      SANSA_USER_ID: ${SANSA_USER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: chi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chi
    volumes:
      - chi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chi -d chi']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chi-postgres:
