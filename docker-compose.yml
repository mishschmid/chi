services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cima
      POSTGRES_PASSWORD: cima
      POSTGRES_DB: cima
    ports:
      - '5434:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cima -d cima']
      interval: 5s
      timeout: 5s
      retries: 5
