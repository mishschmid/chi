services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: chi
      POSTGRES_PASSWORD: chi
      POSTGRES_DB: chi
    ports:
      - '5434:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chi -d chi']
      interval: 5s
      timeout: 5s
      retries: 5
